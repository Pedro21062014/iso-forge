name: Publish to npm

# Publica o pacote automaticamente no npm (https://registry.npmjs.org)
# sempre que uma tag de versão semântica for criada, ex.: `v1.2.0`.
# Também pode ser disparado manualmente pela aba "Actions".
#
# ⚠️ IMPORTANTE: adicione um segredo no repositório antes de publicar:
#   Settings → Secrets and variables → Actions → New repository secret
#     Nome:  NPM_TOKEN
#     Valor: seu token de acesso do npm (https://npmjs.com/settings/tokens)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate / build (se existir script de build)
        run: npm run build --if-present

      - name: Publicar no npm
        # NODE_AUTH_TOKEN vem do segredo NPM_TOKEN configurado no repositório.
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Criar release no GitHub (associada à tag)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: '*.tgz'
